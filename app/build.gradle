// ===== app 模块构建脚本:APTUIDSH 客户端(Kotlin + Jetpack Compose,协议层为纯 Java) =====
// 本 APK 除前端界面外还内置一整套 rootless Linux 运行环境:
//   jniLibs/arm64-v8a/libproroot*.so  ← proroot 启动器与运行时(5 个 .so)
//   assets/rootfs.img                 ← Ubuntu 24.04 + Node.js 22 + dsh 本体(约 117MB)
// 因此必须开启 useLegacyPackaging:让 .so 在安装时真正解包到 nativeLibraryDir,
// 这是 Android 10+ 唯一允许 exec 的目录,proroot 启动器必须从那里执行。
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.aptuidsh.kui'
    compileSdk 34

    defaultConfig {
        applicationId "com.aptuidsh.kui"
        minSdk 24
        targetSdk 34
        versionCode 22
        versionName "1.3.4"

        // proroot 只提供 arm64-v8a 运行时
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // JDK 17 编译(本机 Termux OpenJDK 17);Kotlin 目标 JVM 17
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        jniLibs {
            // 关键:把 libproroot*.so 解包成真实文件(否则 nativeLibraryDir 为空,无法 exec)
            useLegacyPackaging = true
            // 不要裁剪 proroot 的符号/调试信息,避免破坏其自举逻辑
            keepDebugSymbols += ['**/libproroot*.so']
        }
    }

    // 注意:这里刻意【不】对 rootfs.tar.xz 使用 noCompress。
    // 未压缩(uncompressed/stored)的 asset 在读取路径上有一些设备相关的边缘行为,
    // 而 AssetManager.open(ACCESS_STREAMING) 对 Deflated asset 是必然可用的。
    // 代价只是构建时多压缩一次(xz 已高压缩比,APK 体积几乎不变),换来安装环节的确定性。

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // ---- AndroidX 基础 ----
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'

    // ---- Jetpack Compose (BOM 2024.06.00 = Compose 1.6.8,兼容 compileSdk 34) ----
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
